; CD3217-Analyzer — ESP32 / RP2040 standalone unit
; Milestone 1 SPIKE: WiFi web UI + on-device I2C scan
;
; Primary target: ESP32-S3 (16/32MB) — big OTP partition.
; Full family: ESP32 S3/C3/classic + Pico/RP2040 (zero, pico, pico_w, pico2,
; pico2w). ESP32-C6 is flagged but needs ESP-IDF (no Arduino here).
;
; Build a specific board:
;   pio run -e esp32s3      ; ESP32-S3 (primary, web UI)
;   pio run -e esp32c3      ; ESP32-C3 (web UI)
;   pio run -e esp32        ; ESP32 DevKit (web UI)
;   pio run -e rp2040_zero  ; RP2040-Zero (wired)
;   pio run -e pico         ; Pico 1 (wired)
;   pio run -e pico_w       ; Pico W (web UI)
;   pio run -e pico2        ; Pico 2 (wired)
;   pio run -e pico2w       ; Pico 2 W (web UI)
; Flash (only one device at a time):
;   pio run -e esp32s3 -t upload
; Monitor:
;   pio device monitor -b 115200

[platformio]
default_envs = esp32s3
src_dir = src

[common]
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; lib_deps are declared inline per-env. Every board needs ArduinoJson; only
; the WiFi-capable envs also use the built-in WebServer (no external lib).

; ---------------------------------------------------------------
; ESP32-S3 DevKit (primary) — HW I2C SDA=GPIO8, SCL=GPIO9
; ---------------------------------------------------------------
[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
upload_speed = ${common.upload_speed}
lib_deps = bblanchon/ArduinoJson@^7.2.1
board_build.partitions = partitions.csv
build_flags =
    -DCD3217_BOARD=\"esp32-s3-devkitc-1\"
    -DI2C_SDA_GPIO=8
    -DI2C_SCL_GPIO=9
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCD3217_HAS_WIFI
    -DPIN_SPI_SCK=12
    -DPIN_SPI_MISO=13
    -DPIN_SPI_MOSI=11
    -DPIN_SPI_CS=10
    -DPIN_UART_RX=4

; ---------------------------------------------------------------
; ESP32-C6-Zero (Waveshare) — HW I2C SDA=GPIO6, SCL=GPIO7
; ---------------------------------------------------------------
[env:esp32c6]
platform = espressif32
board = esp32-c6-devkitc-1
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
upload_speed = ${common.upload_speed}
