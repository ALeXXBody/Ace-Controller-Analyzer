    -DPIN_SPI_SCK=18
    -DPIN_SPI_MISO=19
    -DPIN_SPI_MOSI=23
    -DPIN_SPI_CS=5
    -DPIN_UART_RX=16

; =============================================================================
; Raspberry Pi / RP2040 family (maxgerhardt/platform-raspberrypi, Arduino core)
; Wired boards (no WiFi): RP2040-Zero, Pico 1, Pico 2 — web UI deferred to M2
; (they become USB-I2C bridges). WiFi boards: Pico W, Pico 2 W — full web UI.
; =============================================================================

