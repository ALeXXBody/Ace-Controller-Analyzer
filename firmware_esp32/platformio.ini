; CD3217-Analyzer — ESP32 standalone unit
; Milestone 1 SPIKE: WiFi web UI + on-device I2C scan
;
; Primary target: ESP32-S3 (16/32MB) — big OTP partition.
; Extras mirrored from VoiceSentry/home-climate conventions.
;
; Build a specific board:
;   pio run -e esp32s3
;   pio run -e esp32c6
;   pio run -e esp32c3
;   pio run -e esp32
; Flash (only one device at a time):
;   pio run -e esp32s3 -t upload
; Monitor:
;   pio device monitor -b 115200

[platformio]
default_envs = esp32s3
src_dir = src

[common]
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    bblanchon/ArduinoJson@^7.2.1
    me-no-dev/ESPAsyncWebServer@^3.3.0
    ESP32Async/AsyncTCP@^3.3.3

; ---------------------------------------------------------------
; ESP32-S3 DevKit (primary) — HW I2C SDA=GPIO8, SCL=GPIO9
; ---------------------------------------------------------------
[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
upload_speed = ${common.upload_speed}
lib_deps = ${common.lib_deps}
board_build.partitions = partitions.csv
build_flags =
    -DBOARD_NAME=\"esp32-s3-devkitc-1\"
    -DI2C_SDA_GPIO=8
    -DI2C_SCL_GPIO=9
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; ---------------------------------------------------------------
; ESP32-C6-Zero (Waveshare) — HW I2C SDA=GPIO6, SCL=GPIO7
; ---------------------------------------------------------------
[env:esp32c6]
platform = espressif32
board = esp32-c6-devkitc-1
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
upload_speed = ${common.upload_speed}
lib_deps = ${common.lib_deps}
board_build.partitions = partitions.csv
build_flags =
    -DBOARD_NAME=\"esp32-c6-zero\"
    -DI2C_SDA_GPIO=6
    -DI2C_SCL_GPIO=7
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; ---------------------------------------------------------------
; ESP32-C3 SuperMini — HW I2C SDA=GPIO8, SCL=GPIO9
; ---------------------------------------------------------------
[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
upload_speed = ${common.upload_speed}
lib_deps = ${common.lib_deps}
board_build.partitions = partitions.csv
build_flags =
    -DBOARD_NAME=\"esp32-c3-supermini\"
    -DI2C_SDA_GPIO=8
    -DI2C_SCL_GPIO=9
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; ---------------------------------------------------------------
; ESP32 DevKit (classic) — HW I2C SDA=GPIO21, SCL=GPIO22
; ---------------------------------------------------------------
[env:esp32]
platform = espressif32
board = esp32dev
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
upload_speed = ${common.upload_speed}
lib_deps = ${common.lib_deps}
board_build.partitions = partitions.csv
build_flags =
    -DBOARD_NAME=\"esp32-devkit\"
    -DI2C_SDA_GPIO=21
    -DI2C_SCL_GPIO=22
