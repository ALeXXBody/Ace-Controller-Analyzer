    -DPIN_SPI_SCK=4
    -DPIN_SPI_MISO=6
    -DPIN_SPI_MOSI=5
    -DPIN_SPI_CS=7
    -DPIN_UART_RX=1

; ---------------------------------------------------------------
; ESP32 DevKit (classic) — HW I2C SDA=GPIO21, SCL=GPIO22
; ---------------------------------------------------------------
