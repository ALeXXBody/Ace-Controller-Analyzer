[env:rp2040_zero]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#develop
board = waveshare_rp2040_zero
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
lib_deps = bblanchon/ArduinoJson@^7.2.1
build_flags =
    -DCD3217_BOARD=\"rp2040-zero\"
    -DI2C_SDA_GPIO=4
    -DI2C_SCL_GPIO=5
    -DPIN_SPI_SCK=14
    -DPIN_SPI_MISO=12
    -DPIN_SPI_MOSI=15
    -DPIN_SPI_CS=13
    -DPIN_UART_RX=1

