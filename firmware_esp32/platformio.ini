board_build.partitions = partitions.csv
build_flags =
    -DCD3217_BOARD=\"esp32-c6-zero\"
    -DI2C_SDA_GPIO=14
    -DI2C_SCL_GPIO=15
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DPIN_SPI_SCK=21
    -DPIN_SPI_MISO=20
    -DPIN_SPI_MOSI=19
    -DPIN_SPI_CS=18
    -DPIN_UART_RX=1

; ---------------------------------------------------------------
; ESP32-C3 SuperMini — HW I2C SDA=GPIO8, SCL=GPIO9
; ---------------------------------------------------------------
[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
