name: Build Windows .exe + ESP32 firmware

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyinstaller customtkinter smbus2 pyserial

      - name: Build .exe
        run: >
          pyinstaller
          --name "CD3217B12_Analyzer"
          --onedir
          --windowed
          --noconfirm
          --clean
          --icon assets/icon.ico
          --add-data "assets;assets"
          --collect-all customtkinter
          --collect-all cd3217_analyzer
          --hidden-import cd3217_analyzer
          --hidden-import cd3217_analyzer.registers
          --hidden-import cd3217_analyzer.analyzer
          --hidden-import cd3217_analyzer.adapters
          --hidden-import cd3217_analyzer.report
          --hidden-import cd3217_analyzer.models
          --hidden-import cd3217_analyzer.otp
          --hidden-import cd3217_analyzer.spi_adapter
          --hidden-import cd3217_analyzer.flash
          --hidden-import cd3217_analyzer.flash_board
          --hidden-import cd3217_analyzer.usb_bridge
          --hidden-import cd3217_analyzer.spi_bridge
          --hidden-import cd3217_analyzer.cli
          --hidden-import serial
          --hidden-import serial.tools
          --hidden-import serial.tools.list_ports
          gui.py

      - name: Create portable package
        shell: pwsh
        run: |
          $exeDir = "dist\CD3217B12_Analyzer"
          if (-not (Test-Path $exeDir)) {
            Write-Error "Build output not found at $exeDir"
            exit 1
          }
          # Portable zip contains the app folder only — no Run.bat launcher,
          # the .exe is windowed (no console flash) and runs directly.
          Compress-Archive -Path $exeDir -DestinationPath CD3217B12_Portable.zip -Force
          $zipSize = (Get-Item CD3217B12_Portable.zip).Length / 1MB
          Write-Host "Package created: $([math]::Round($zipSize,1)) MB"

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            Write-Error "Inno Setup 6 not found at $iscc"
            exit 1
          }
          # Pass the tag (e.g. v0.4) as the installer version when available.
          $ver = "${env:GITHUB_REF_NAME}" -replace '^v',''
          if ($ver -notmatch '^\d+\.\d+') { $ver = "0.0.0" }
          & $iscc "/DAppVersion=$ver" installer.iss
          if (-not (Test-Path "installer\CD3217B12_Analyzer_Setup.exe")) {
            Write-Error "Installer was not produced"
            exit 1
          }

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            CD3217B12_Portable.zip
            installer/CD3217B12_Analyzer_Setup.exe
          generate_release_notes: true

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build firmware (all boards)
        working-directory: firmware_esp32
        run: |
          pio run -e esp32s3 -e esp32c3 -e esp32 \
                  -e rp2040_zero -e pico -e pico_w -e pico2 -e pico2w

      - name: Collect artifacts
        working-directory: firmware_esp32
        run: |
          mkdir -p dist
          for e in esp32s3 esp32c3 esp32 rp2040_zero pico pico_w pico2 pico2w; do
            cp ".pio/build/$e/firmware.bin" "dist/cd3217_$e.bin"
          done
          for e in rp2040_zero pico pico_w pico2 pico2w; do
            cp ".pio/build/$e/firmware.uf2" "dist/cd3217_$e.uf2"
          done
          ls -la dist

      - name: Upload firmware to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: firmware_esp32/dist/*
          generate_release_notes: true
