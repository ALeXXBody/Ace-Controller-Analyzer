name: Build Windows .exe

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyinstaller customtkinter smbus2

      - name: Build .exe
        run: >
          pyinstaller
          --name "CD3217B12_Analyzer"
          --windowed
          --noconfirm
          --clean
          --hidden-import customtkinter
          --hidden-import cd3217_analyzer
          --hidden-import cd3217_analyzer.registers
          --hidden-import cd3217_analyzer.analyzer
          --hidden-import cd3217_analyzer.adapters
          --hidden-import cd3217_analyzer.report
          --hidden-import cd3217_analyzer.models
          --hidden-import cd3217_analyzer.otp
          --hidden-import cd3217_analyzer.spi_adapter
          --hidden-import cd3217_analyzer.flash
          --hidden-import cd3217_analyzer.cli
          gui.py

      - name: Create portable package
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Filter "*.exe" | Select-Object FullName
          mkdir CD3217B12_Portable
          Copy-Item dist\CD3217B12_Analyzer.exe CD3217B12_Portable\ -ErrorAction SilentlyContinue
          if (-not (Test-Path CD3217B12_Portable\CD3217B12_Analyzer.exe)) {
            $exe = Get-ChildItem -Recurse -Filter "CD3217B12_Analyzer.exe" | Select-Object -First 1
            if ($exe) { Copy-Item $exe.FullName CD3217B12_Portable\ }
          }
          if (-not (Test-Path CD3217B12_Portable\CD3217B12_Analyzer.exe)) {
            Write-Error "EXE not found after build"
            exit 1
          }
          Set-Content -Path CD3217B12_Portable\Run.bat -Value "@echo off`r`ncd /d `"%~dp0`"`r`nstart CD3217B12_Analyzer.exe" -Encoding ASCII
          Compress-Archive -Path CD3217B12_Portable -DestinationPath CD3217B12_Portable.zip -Force

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: CD3217B12_Portable.zip
          generate_release_notes: true
